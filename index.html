<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
</head>

<body>

    <div class="bg_blob" id="blob1"></div>
    <div class="bg_blob" id="blob2"></div>

    <div id="app_wrap">

        <header id="header_container">
            <div id="greeting_container">
                <p id="greeting_text">Good morning,</p>
                <h1>My Tasks</h1>
                <p id="date_text"></p>
            </div>
            <span id="weather_icon">⛅</span>
        </header>

        <section id="add_container" class="glass_card">
            <h2>Add a Task</h2>
            <form id="add_form">
                <input type="text" id="task_input" placeholder="What do you need to do?">
                <select id="importance_select">
                    <option value="Low" selected>Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <button type="submit" id="add_btn">Add</button>
            </form>
            <p id="error_msg"></p>
        </section>

        <section id="timer_container" class="glass_card">
            <h2>Doing Now</h2>
            <p id="doing_now_title">No task selected</p>
            <p id="timer_display">30:00</p>
            <div id="timer_controls">
                <select id="duration_select">
                    <option value="10">10 min</option>
                    <option value="20">20 min</option>
                    <option value="30" selected>30 min</option>
                    <option value="40">40 min</option>
                    <option value="50">50 min</option>
                    <option value="60">60 min</option>
                    <option value="70">70 min</option>
                    <option value="80">80 min</option>
                    <option value="90">90 min</option>
                    <option value="100">100 min</option>
                    <option value="110">110 min</option>
                    <option value="120">120 min</option>
                </select>
                <button id="start_btn">Start</button>
                <button id="reset_btn">Reset</button>
                <button id="clear_btn">Clear</button>
            </div>
        </section>

        <section id="list_container" class="glass_card">
            <h2>Tasks</h2>
            <p id="list_error"></p>
            <p id="empty_msg">No tasks yet. Add one above!</p>
            <ul id="task_list"></ul>
        </section>

    </div>

    <div id="modal_overlay" class="hidden">
        <div id="modal_box" class="glass_card">
            <h2>Time's up!</h2>
            <p>Did you finish this task?</p>
            <p id="modal_task_title"></p>
            <div id="modal_buttons">
                <button id="yes_btn">Yes</button>
                <button id="no_btn">No</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
